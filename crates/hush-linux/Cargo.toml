[package]
name = "hush-linux"
description = "The Linux platform for Hush: AT-SPI accessibility, and input that stays off the user's display"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hush-core = { path = "../hush-core" }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
jpeg-encoder = "0.7"
serde = "1"
x11rb = { version = "0.14", features = ["xtest"] }
zbus = "5.19"

[dev-dependencies]
# Tests drive real apps through the engine, as an agent would.
hush-engine = { path = "../hush-engine" }

[lints]
workspace = true
