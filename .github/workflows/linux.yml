name: Linux apps

# Reads real GTK and Qt apps through AT-SPI, headlessly: Xvfb is the display
# and dbus-run-session a private session bus, so nothing needs a desktop.
on:
  pull_request:
    paths:
      - "crates/hush-linux/**"
      - "crates/hush-core/**"
      - "crates/hush/**"
      - "Cargo.lock"
      - ".github/workflows/linux.yml"
  push:
    branches: [main]
    paths:
      - "crates/hush-linux/**"

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # GTK 4 and Qt draw in software under Xvfb.
      GSK_RENDERER: cairo
      LIBGL_ALWAYS_SOFTWARE: "1"
      # Qt exposes its tree only when asked to, or when a screen reader runs.
      QT_LINUX_ACCESSIBILITY_ALWAYS_ON: "1"
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Install a headless desktop and test apps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus dbus-x11 at-spi2-core \
            gtk-3-examples gnome-calculator featherpad libxcb-cursor0
      - name: Diagnose Qt (temporary)
        run: |
          xvfb-run -a dbus-run-session -- bash -c '
            dbus-send --session --dest=org.a11y.Bus /org/a11y/bus org.freedesktop.DBus.Properties.Set string:org.a11y.Status string:IsEnabled variant:boolean:true
            QT_DEBUG_PLUGINS=0 featherpad > /tmp/fp.log 2>&1 &
            sleep 6
            ps aux | grep -i [f]eather || echo "featherpad not running"
            cat /tmp/fp.log | head -20
            ldd $(which featherpad) | grep -i qt | head -5
            busctl --user list 2>/dev/null | head -20' || true
      - run: cargo build --release -p hush-linux --tests
      - name: Read real apps
        run: xvfb-run -a dbus-run-session -- cargo test --release -p hush-linux -- --ignored --test-threads=1 --nocapture
