name: Linux apps

# Reads real GTK 3 and GTK 4 apps through AT-SPI, headlessly: Xvfb is the display
# and dbus-run-session a private session bus, so nothing needs a desktop.
on:
  pull_request:
    paths:
      - "crates/hush-linux/**"
      - "crates/hush-core/**"
      - "crates/hush/**"
      - "Cargo.lock"
      - ".github/workflows/linux.yml"
      - "scripts/linux-apps.sh"
      - "scripts/linux-desktop.sh"
  push:
    branches: [main]
    paths:
      - "crates/hush-linux/**"

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # GTK 4 draws in software under Xvfb.
      GSK_RENDERER: cairo
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Install a headless desktop and test apps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus dbus-x11 at-spi2-core \
            gtk-3-examples gnome-calculator \
            ffmpeg fontconfig fonts-dejavu-core
      - run: cargo build --release -p hush-linux --tests
      - name: Read real apps
        run: xvfb-run -a dbus-run-session -- cargo test --release -p hush-linux -- --ignored --test-threads=1 --nocapture
      - run: cargo build --release -p hush
      - name: The hush binary, end to end
        # The commands an agent runs, through the per-user host they share.
        run: |
          xvfb-run -a dbus-run-session -- bash -euxo pipefail -c '
            hush=target/release/hush
            $hush setup --skills-dir "$RUNNER_TEMP/skills"
            test -s "$RUNNER_TEMP/skills/hush/SKILL.md"
            $hush observe Calculator | tee "$RUNNER_TEMP/observe.txt"
            grep -q "started Calculator" "$RUNNER_TEMP/observe.txt"
            $hush apps | grep Calculator
            $hush act Calculator "key 4" "key 2"
            # Calculator shows a result about 250 ms after the key.
            for _ in $(seq 30); do
              $hush observe Calculator --full | grep -q "\b42\b" && break
              sleep 0.1
            done
            $hush observe Calculator --full | grep "\b42\b"
            $hush see Calculator --out "$RUNNER_TEMP/see.jpg"
            test -s "$RUNNER_TEMP/see.jpg"
            if $hush apps | grep "Calculator.*front"; then exit 1; fi
            pkill -x hush || true
            pkill -x gnome-calculator || true
          '
      - name: Keep the test recording, to look at the drawn cursor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-recording
          path: /tmp/hush-linux-recording.mp4
          if-no-files-found: ignore
          retention-days: 7

  more-apps:
    # The apps agents reach for: a GTK 3, a GTK 4 and a Qt editor,
    # LibreOffice and Firefox, each started on Hush's display, read, typed
    # into and pictured through the hush binary.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GSK_RENDERER: cairo
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install the apps
        run: |
          # Ubuntu's firefox package is a snap, which doesn't run here;
          # Mozilla's own repository has a plain package.
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://packages.mozilla.org/apt/repo-signing-key.gpg | sudo tee /etc/apt/keyrings/packages.mozilla.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" | sudo tee /etc/apt/sources.list.d/mozilla.list
          printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n' | sudo tee /etc/apt/preferences.d/mozilla
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus dbus-x11 at-spi2-core fontconfig fonts-dejavu-core \
            gnome-calculator mousepad gnome-text-editor \
            libreoffice-writer libreoffice-gtk3 featherpad \
            firefox gdb
      - name: Skip Firefox's first-run pages, as on a browser someone already uses
        run: |
          sudo install -d /etc/firefox/policies
          echo '{"policies":{"DontCheckDefaultBrowser":true,"OverrideFirstRunPage":"","OverridePostUpdatePage":"","UserMessaging":{"SkipOnboarding":true,"MoreFromMozilla":false}}}' \
            | sudo tee /etc/firefox/policies/policies.json
      - name: Skip Chrome's first-run prompts (Chrome comes with the runner)
        run: |
          sudo install -d /etc/opt/chrome/policies/managed
          echo '{"DefaultBrowserSettingEnabled":false,"PromotionsEnabled":false,"MetricsReportingEnabled":false,"BrowserSignin":0}' \
            | sudo tee /etc/opt/chrome/policies/managed/hush.json
      - run: cargo build --release -p hush
      - name: Drive them through hush
        run: xvfb-run -a dbus-run-session -- scripts/linux-apps.sh target/release/hush calculator gtk3 gtk4 writer qt firefox chrome
      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-app-pictures
          path: ${{ runner.temp }}/hush-apps
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    # A real desktop: GNOME Shell on Wayland, headless, with the person's
    # own Calculator open on it. Hush must read and click it through
    # accessibility, refuse raw keys and pictures of it, and keep the apps
    # it starts on its own display, off the desktop.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnome-shell gnome-calculator gnome-text-editor xvfb at-spi2-core dbus-x11
      - run: cargo build --release -p hush
      - run: dbus-run-session -- scripts/linux-desktop.sh target/release/hush
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: ${{ runner.temp }}/hush-desktop
          if-no-files-found: ignore
          retention-days: 7
