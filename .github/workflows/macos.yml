name: macOS

# macOS minutes cost ten times Linux ones, so this runs only when code that
# compiles differently on macOS changes.
on:
  pull_request:
    paths:
      - "crates/hush-macos/**"
      - "crates/hush/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/macos.yml"
  push:
    branches: [main]
    paths:
      - "crates/hush-macos/**"
      - "crates/hush/**"

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Tests that read or drive real apps are #[ignore]d: CI has no
      # Accessibility permission.
      - run: cargo test --workspace
