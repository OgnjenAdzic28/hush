name: Release

# Builds one universal macOS binary and static Linux binaries for x86_64 and
# arm64. A pushed tag (v0.2.0) publishes them as a GitHub release, which
# install.sh downloads; pull requests that touch the packaging build them
# without publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "install.sh"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p hush --target aarch64-apple-darwin
      - run: cargo build --release --locked -p hush --target x86_64-apple-darwin
      - name: Package
        run: |
          mkdir dist
          lipo -create -output dist/hush \
            target/aarch64-apple-darwin/release/hush \
            target/x86_64-apple-darwin/release/hush
          # lipo drops the linker's ad-hoc signature, and Apple silicon won't
          # run an unsigned binary.
          codesign --force --sign - dist/hush
          dist/hush --version
          tar -czf hush-macos.tar.gz -C dist hush
          shasum -a 256 hush-macos.tar.gz > hush-macos.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: hush-macos
          path: hush-macos.tar.gz*

  linux:
    # Static (musl) binaries: Hush's D-Bus and X11 clients are pure Rust,
    # so one file runs on any distribution.
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p hush --target ${{ matrix.arch }}-unknown-linux-musl
      - name: Package
        run: |
          mkdir dist
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/hush dist/hush
          file dist/hush
          dist/hush --version
          name=hush-linux-${{ matrix.arch }}
          tar -czf $name.tar.gz -C dist hush
          sha256sum $name.tar.gz > $name.tar.gz.sha256
      - name: install.sh installs it
        run: |
          HUSH_INSTALL_DIR="$RUNNER_TEMP/bin" \
            HUSH_DOWNLOAD_URL="file://$PWD/hush-linux-${{ matrix.arch }}.tar.gz" sh install.sh
          "$RUNNER_TEMP/bin/hush" --version
      - uses: actions/upload-artifact@v4
        with:
          name: hush-linux-${{ matrix.arch }}
          path: hush-linux-${{ matrix.arch }}.tar.gz*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -xzf hush-linux-x86_64.tar.gz hush
          version="v$(./hush --version | cut -d' ' -f2)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match the binary's $version" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            hush-macos.tar.gz hush-macos.tar.gz.sha256 \
            hush-linux-x86_64.tar.gz hush-linux-x86_64.tar.gz.sha256 \
            hush-linux-aarch64.tar.gz hush-linux-aarch64.tar.gz.sha256 \
            --title "Hush $GITHUB_REF_NAME" --generate-notes

  installed:
    # What a Linux user gets: install.sh on a fresh machine, then Hush
    # starting Calculator on its own display, typing 42 and reading it back.
    # On a tag this runs the published one-liner against the release; on a
    # pull request it installs the build above.
    needs: [linux, publish]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.publish.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-x86_64
            runner: ubuntu-24.04
            arch: x86_64
          - name: ubuntu-arm64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - name: debian-12
            runner: ubuntu-24.04
            arch: x86_64
            container: debian:12
          - name: fedora-41
            runner: ubuntu-24.04
            arch: x86_64
            container: fedora:41
    name: installed (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 20
    env:
      GSK_RENDERER: cairo
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Install what Hush needs and an app to drive
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y --setopt=install_weak_deps=False \
              curl tar gzip procps-ng xorg-x11-server-Xvfb xorg-x11-xauth \
              dbus-daemon dbus-tools at-spi2-core gnome-calculator
          else
            sudo=$(command -v sudo || true)
            $sudo apt-get update
            DEBIAN_FRONTEND=noninteractive $sudo apt-get install -y --no-install-recommends \
              curl ca-certificates procps xvfb xauth dbus dbus-x11 at-spi2-core gnome-calculator
          fi
      - uses: actions/checkout@v4
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/download-artifact@v4
        with:
          name: hush-linux-${{ matrix.arch }}
          path: build
      - name: install.sh
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            # The command the README gives, word for word.
            curl -fsSL https://raw.githubusercontent.com/OgnjenAdzic28/hush/main/install.sh | sh
            "$HOME/.local/bin/hush" --version | grep -x "hush ${GITHUB_REF_NAME#v}"
          else
            HUSH_DOWNLOAD_URL="file://$PWD/build/hush-linux-${{ matrix.arch }}.tar.gz" sh install.sh
          fi
      - name: Drive Calculator
        run: xvfb-run -a dbus-run-session -- bash scripts/linux-apps.sh "$HOME/.local/bin/hush" calculator
